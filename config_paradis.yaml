experiment:
  name: "spherical_swe_paradis"
  seed: 42
  model_type: "paradis"

data:
  nlat: 128
  nlon: 256
  dt: 60               # Time step for the model
  dt_solver: 60        # Time step for the underlying solver
  batch_size: 4
  num_workers: 0        # Set to 0 if dataset generation issues occur
  grid: "equiangular"   # PARADIS requires equiangular grid
  num_train_examples: 512
  num_val_examples: 64

loss:
  loss_function: "reversed_huber"   # Options: "reversed_huber", "mse", "mae, "amse"
  delta_loss: 1.0                   # Threshold for the reversed Huber loss

logging:
  tensorboard: true
  mlflow:
    enabled: false
    tracking_uri: "./mlruns"
    experiment_name: "swan"
    run_name: null

model:
  paradis:
    # --- Top-level model parameters ---
    hidden_dim: 32        # cfg.model.latent_size in upstream
    num_layers: 4         # Number of ADR layers
    num_vels: 6           # cfg.model.velocity_vectors in upstream
    base_dt: 60           # Must match data.dt; cfg.model.base_dt in upstream
    interpolation: "bicubic"  # cfg.model.adv_interpolation in upstream; "bilinear" or "bicubic"
    bias_channels: 2      # cfg.model.bias_channels in upstream
    activation: "SiLU"    # cfg.model.activation in upstream; "SiLU" or "GELU"

    # --- Sub-block architecture (cfg.model.physblock in upstream) ---
    # layers: sequence of block types applied in order
    # hidden_dim: width of intermediate channels between layers (0 = use input/output dim)
    physblock:
      input_proj:
        layers: ["SepConv", "CLinear"]
        hidden_dim: 32
      velocity_net:
        layers: ["SepConv"]
        hidden_dim: 32
      diffusion:
        layers: ["SepConv"]
        hidden_dim: 16
      reaction:
        layers: ["CLinear", "CLinear"]
        hidden_dim: 16
      output_proj:
        layers: ["SepConv", "CLinear"]
        hidden_dim: 32
      advection:
        down_projection:
          layers: ["CLinear"]
          hidden_dim: 0
        up_projection:
          layers: ["SepConv"]
          hidden_dim: 0

training:
  optimizer: adam          # adam | adamw | gauss_newton | mud | muon | sgd
  pretrain_epochs: 25
  finetune_epochs: 0
  # Consine LR schedule: lr decays towards (but never corsses) cosine_eta_min.
  # Remove this key to fall back to MultiStepLR or ReduceLROnPlateau.
  cosine_eta_min: 1.0e-6
  # Deterministic LR schedule: decay by lr_gamma at each milestone epoch.
  # Remove these two keys to fall back to ReduceLROnPlateau.
  lr_milestones: [10, 16]
  lr_gamma: 0.5
  adam:
    learning_rate: 1.0e-2
    finetune_learning_rate: 1.0e-3
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.0
  adamw: 
    learning_rate: 1.0e-2
    finetune_learning_rate: 1.0e-3
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.01
  gauss_newton:
    method: "matrix_free"  # matrix_free | explicit
    damping: 1.0e-3
    cg_iters: 2            # matrix_free only
    cg_tol: 1.0e-6         # matrix_free only
    step_size: 1.0
    max_step_norm: 1.0
  muon:
    learning_rate: 1.0e-2
    finetune_learning_rate: 1.0e-3
    momentum: 0.95
    weight_decay: 0.0
  sgd:
    learning_rate: 1.0e-2
    finetune_learning_rate: 1.0e-3
    momentum: 0.9
    weight_decay: 0.0
  mud:
    learning_rate: 1.0e-2
    finetune_learning_rate: 1.0e-3
    weight_decay: 1.0e-2
    beta: 0.95
    passes: 1
    epsilon: 1.0e-8

  nfuture: 1
  amp_mode: "none"      # Options: "none", "fp16", "bf16"
  log_every_n_steps: 10
  save_dir: "./logs"
  gradient_checkpointing: false  # cfg.compute.gradient_checkpointing in upstream


