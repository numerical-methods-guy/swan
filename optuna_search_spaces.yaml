global:
  hidden_dim:
    config_key: model.paradis.hidden_dim
    type: categorical
    choices: [16, 32, 64]

  num_layers:
    config_key: model.paradis.num_layers
    type: int
    low: 1
    high: 4

  num_vels:
    config_key: model.paradis.num_vels
    type: categorical
    choices: [2, 4, 6, 8]

  bias_channels:
    config_key: model.paradis.bias_channels
    type: categorical
    choices: [0, 1, 2, 4, 8]


sgd:
  learning_rate:
    config_key: training.learning_rate
    type: float
    low: 1.0e-4
    high: 1.0e-1
    log: true

  momentum:
    config_key: training.momentum
    type: float
    low: 0.0
    high: 0.99

  sgd_weight_decay:
    config_key: training.sgd_weight_decay
    type: categorical
    choices: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3]


adam:
  learning_rate:
    config_key: training.learning_rate
    type: float
    low: 1.0e-5
    high: 1.0e-2
    log: true

  beta1:
    config_key: training.beta1
    type: float
    low: 0.8
    high: 0.99

  beta2:
    config_key: training.beta2
    type: float
    low: 0.9
    high: 0.9999

  epsilon:
    config_key: training.epsilon
    type: float
    low: 1.0e-8
    high: 1.0e-4
    log: true

  adam_weight_decay:
    config_key: training.adam_weight_decay
    type: categorical
    choices: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3]


adamw:
  learning_rate:
    config_key: training.learning_rate
    type: float
    low: 1.0e-5
    high: 1.0e-2
    log: true

  beta1:
    config_key: training.beta1
    type: float
    low: 0.8
    high: 0.99

  beta2:
    config_key: training.beta2
    type: float
    low: 0.9
    high: 0.9999

  adamw_weight_decay:
    config_key: training.adamw_weight_decay
    type: categorical
    choices: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]


muon:
  learning_rate:
    config_key: training.learning_rate
    type: float
    low: 1.0e-5
    high: 1.0e-2
    log: true

  muon_lr:
    config_key: training.muon_lr
    type: float
    low: 1.0e-5
    high: 1.0e-1
    log: true

  adamw_lr:
    config_key: training.adamw_lr
    type: float
    low: 1.0e-5
    high: 1.0e-2
    log: true

  muon_momentum:
    config_key: training.muon_momentum
    type: float
    low: 0.8
    high: 0.99

  muon_weight_decay:
    config_key: training.muon_weight_decay
    type: categorical
    choices: [0.0, 1.0e-6, 1.0e-5, 1.0e-4]

  adamw_weight_decay:
    config_key: training.adamw_weight_decay
    type: categorical
    choices: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3]


mud:
  learning_rate:
    config_key: training.learning_rate
    type: float
    low: 1.0e-5
    high: 1.0e-2
    log: true

  weight_decay:
    config_key: training.weight_decay
    type: categorical
    choices: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]

  beta_mud:
    config_key: training.beta_mud
    type: float
    low: 0.8
    high: 0.99

  mud_passes:
    config_key: training.mud_passes
    type: int
    low: 1
    high: 3


gauss_newton:
  damping:
    config_key: training.gauss_newton.damping
    type: float
    low: 1.0e-5
    high: 1.0e-1
    log: true

  step_size:
    config_key: training.gauss_newton.step_size
    type: float
    low: 0.1
    high: 1.0

  cg_iters:
    config_key: training.gauss_newton.cg_iters
    type: int
    low: 1
    high: 5