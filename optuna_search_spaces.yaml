global:
  hidden_dim:
    config_key: model.paradis.hidden_dim
    type: categorical
    choices: [16, 32, 64]

  num_layers:
    config_key: model.paradis.num_layers
    type: int
    low: 1
    high: 4

  num_vels:
    config_key: model.paradis.num_vels
    type: categorical
    choices: [2, 4, 6, 8]

  bias_channels:
    config_key: model.paradis.bias_channels
    type: categorical
    choices: [0, 1, 2, 4, 8]


sgd:
  learning_rate:
    config_key: training.sgd.learning_rate
    type: float
    low: 1.0e-4
    high: 1.0e-1
    log: true

  momentum:
    config_key: training.sgd.momentum
    type: float
    low: 0.0
    high: 0.99

  weight_decay:
    config_key: training.sgd.weight_decay
    type: categorical
    choices: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3]


adam:
  learning_rate:
    config_key: training.adam.learning_rate
    type: float
    low: 1.0e-5
    high: 1.0e-2
    log: true

  beta1:
    config_key: training.adam.beta1
    type: float
    low: 0.8
    high: 0.99

  beta2:
    config_key: training.adam.beta2
    type: float
    low: 0.9
    high: 0.9999

  weight_decay:
    config_key: training.adam.weight_decay
    type: categorical
    choices: [0.0, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3]


adamw:
  learning_rate:
    config_key: training.adamw.learning_rate
